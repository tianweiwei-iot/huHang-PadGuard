# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 仅 Gradle 9.4+ 生效（当前 wrapper 为 8.13，暂为惰性配置）：
# 允许并行运行 Tooling Model Builders 以加速 IDE Sync；未显式设置时默认跟随 org.gradle.parallel。
org.gradle.tooling.parallel=true

android.useAndroidX=true
# 允许项目路径包含中文（Windows）
android.overridePathCheck=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 构建目标
COMPILE_SDK=35
MIN_SDK=26
TARGET_SDK=35

# 版本
VERSION_NAME=1.0.0
VERSION_CODE=1

# 构建产物输出根目录（可选覆盖）。
# 不配置时由 build.gradle.kts 自动推导为 <项目盘符>:/builds/padguard。
# 硬约束：必须是纯 ASCII 绝对路径，且与项目位于同一盘符（详见 build.gradle.kts 注释）。
# padguard.build.root=E:/builds/padguard
