# Project-wide Gradle settings
# Gradle daemon 堆：承载构建逻辑、KSP/Hilt/Room 注解处理器，需要较大堆。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Kotlin 编译 daemon 堆：未显式配置时默认继承上面的 -Xmx4096m，
# 在同时开 Android Studio + 本地服务端的机器上两个 4G 堆叠加会被系统杀掉，
# 报 "Connection to the Kotlin daemon has been unexpectedly lost"。2G 足够本工程编译。
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
# 仅 Gradle 9.4+ 生效（当前 wrapper 为 8.13，暂为惰性配置）：
# 允许并行运行 Tooling Model Builders 以加速 IDE Sync；未显式设置时默认跟随 org.gradle.parallel。
org.gradle.tooling.parallel=true

android.useAndroidX=true
# 允许项目路径包含中文（Windows）
android.overridePathCheck=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 构建目标
COMPILE_SDK=35
MIN_SDK=26
TARGET_SDK=35

# 版本（递增规则同家长端：versionCode 单调 +1，否则设备端会当作降级而装不上新包）
# 发版升版（versionCode≥5，与 CI 版本号守卫同批）
VERSION_NAME=1.0.4
VERSION_CODE=5

# 构建产物输出根目录（可选覆盖）。
# 不配置时由 build.gradle.kts 自动推导为 <项目盘符>:/builds/padguard。
# 硬约束：必须是纯 ASCII 绝对路径，且与项目位于同一盘符（详见 build.gradle.kts 注释）。
# padguard.build.root=E:/builds/padguard
