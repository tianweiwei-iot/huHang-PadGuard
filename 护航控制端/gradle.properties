# Project-wide Gradle settings
# 构建内存预算：本机 16GB，若 Android Studio + 模拟器同时开，daemon 4G 会把
# 系统提交内存(物理+页面文件)打满，JVM 会以 native OOM 崩溃（hs_err_pid*.log）。
# 因此收紧 daemon 堆，并显式限制 Kotlin 编译守护进程的堆。
# 注意：若加大了 Windows 页面文件，可适当回调这两个值以加快构建。
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
# 限制并行 worker 数，降低峰值内存
org.gradle.workers.max=4
android.useAndroidX=true
# 允许项目路径包含中文（Windows）
android.overridePathCheck=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Build configuration
COMPILE_SDK=35
MIN_SDK=26
TARGET_SDK=35

# Version info
# 版本号必须单调递增：
# - versionCode 每次发版 +1。设备已装的若与之相同或更高，安装会被跳过/当作降级而装不上，
#   表现为"重新 Run 了、App 里却还是旧行为"。
# - versionName 同步递增，便于在手机「应用信息」里核对装的是不是最新包（旧包为 1.0.0）。
# 注意：这两项会**覆盖** app/build.gradle.kts 中 defaultConfig 的默认值，改这里才生效。
# 发版升版（versionCode≥5，与 CI 版本号守卫同批）
VERSION_NAME=1.0.5
VERSION_CODE=5

# Dependency versions (centralized)
KOTLIN_VERSION=2.0.21
COMPOSE_BOM=2024.12.01
HILT_VERSION=2.52
RETROFIT_VERSION=2.11.0
OKHTTP_VERSION=4.12.0
ROOM_VERSION=2.6.1
NAVIGATION_VERSION=2.8.5
COIL_VERSION=2.7.0
DATASTORE_VERSION=1.1.1

# 若本机默认 JDK 过新（Gradle 8.13 不支持 Java 25 / Android Studio 自带 JBR），
# 需要手动指定 Gradle daemon 用的 JDK 目录。
# 注意：这里是**机器相关**路径，不要把绝对路径提交进版本库（会破坏其他机器 / CI 的构建）。
# 请在个人全局配置里设置一次即可（不进版本库）：
#   文件：C:\Users\<你的用户名>\.gradle\gradle.properties
#   内容：org.gradle.java.home=C:/Users/<你的用户名>/jdk21/jdk-21.0.12+8
# 本项目所有模块 compileOptions 均为 JavaVersion.VERSION_17，JDK 17 / 21 都可以。
# org.gradle.java.home=C:/Users/Administrator/jdk21/jdk-21.0.12+8

# 构建产物输出根目录：重定向到纯 ASCII 路径（默认 E:/builds/padguard-parent）。
# 项目路径含中文时必填——Windows 上 JVM test worker 无法从含非 ASCII 的 classpath 加载类，
# 会让所有单元测试报 ClassNotFoundException。默认已按项目盘符推导为 E:/builds/padguard-parent
# （与孩子端 E:/builds/padguard 区分，避免产物目录冲突）。如需换盘符/目录，取消注释并修改：
# padguard.build.root=E:/builds/padguard-parent
