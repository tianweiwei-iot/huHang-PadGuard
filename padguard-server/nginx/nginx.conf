worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # ---- 访问日志脱敏 ----
    # 旧版家长端连 WebSocket 走 `wss://host/ws?token=<JWT>`（新版已改 Authorization 头，
    # 但存量 APK 仍在用 query）。默认的 combined 格式会把整条 $request 写进 access.log，
    # 等于把长效 access token 明文落盘：能读日志的人（运维、日志采集、备份）即可冒充该家长，
    # 且 token 有效期 2 小时、可反复使用。这里只把 token 的值替换成 ***，其余保留以便排障。
    #
    # 为什么用 map 而不是改客户端：客户端升级不可控（存量 APK 不会自动更新），
    # 而"日志里不该出现凭据"是服务端自己的责任，必须在服务端闭合。
    # 正则用非贪婪 `.*?`：从**第一个** token= 开始打码。
    # `[?&]` 必须同时允许「首个参数 ?token=」与「后续参数 &token=」两种形态：
    # 旧写法 `[^?]*\?.*?[?&]token=` 已经把唯一的 ? 消耗掉，还要求再来一个分隔符，
    # 恰好漏掉存量 APK 的 `/ws?token=<JWT>`，使注释里点名要保护的场景明文落盘。
    map $request_uri $pg_safe_uri {
        "~^(?<pre>.*?[?&]token=)[^&]*(?<post>.*)$" "$pre***$post";
        default $request_uri;
    }
    log_format padguard '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $pg_safe_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log padguard;

    # WebSocket 升级：Upgrade/Connection 属于 hop-by-hop 头，默认不透传；
    # nginx 反代默认 HTTP/1.0，不显式开 1.1 后端永远收不到 101 切换。
    # 生产只暴露 nginx 80/443（app 仅在 compose 内网监听 8080），
    # 缺这段会让 /ws 与 /v1/ws 的实时推送整体握手失败。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 安全响应头：HSTS 强制后续访问走 HTTPS，杜绝 SSL Strip
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # HTTP → HTTPS 重定向（避免明文入口被利用）
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS 反向代理到后端（TLS 在此终止，后端仅内网 http）
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 上传文件可能较大（录屏/截图），与后端 200MB 上限对齐
        client_max_body_size 200m;

        location / {
            proxy_pass http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            # 实时看屏流与上行请求：后端 streaming.request-timeout=1800000（30min），
            # 这里必须 ≥ 后端，否则看屏流在 10 分钟被 nginx 单方面掐断，而后端还在等——
            # 表现为"看到一半黑屏且无报错"，注释却写着"与后端一致"，排障时极具误导。
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }
    }
}
