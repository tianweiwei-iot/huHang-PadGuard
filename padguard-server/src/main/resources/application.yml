server:
  port: 8080
  tomcat:
    # 必须显式固定 basedir：默认是系统临时目录下的 tomcat.<port>.<随机>，
    # 于是 accesslog 里写的相对路径 ./logs 会被解析到那个临时目录里去，
    # 结果日志"确实在写、但没人找得到"，排障时反而更困惑；临时目录还会被系统清理。
    basedir: ./tomcat-work
    # 访问日志：排查"管控端连不上"时，第一件事就是判断"请求到底有没有到达服务端"。
    # 没有它，只能靠猜测区分「网络不通 / 地址填错 / 服务端处理失败」，排障成本极高。
    accesslog:
      enabled: true
      # 相对 basedir 解析，最终落在 <应用目录>/tomcat-work/logs
      directory: ./logs
      prefix: padguard-access
      suffix: .log
      # %h 客户端IP | %r 请求行 | %s 状态码 | %b 响应字节 | %D 耗时(ms)
      pattern: '%h %t "%r" %s %b bytes %D ms'
      rotate: true
      # buffered 默认为 true，日志会先攒在内存里不落盘 —— 排查线上问题时
      # 恰恰是"最新的几条请求"最关键，攒着看不到等于没有，必须关掉。
      buffered: false

padguard:
  amap:
    # 高德 Web 服务 Key（逆地理编码用）。默认空 = 不做地址反查，定位坐标照常上报与展示。
    # 私有化部署时由运维通过环境变量 PADGUARD_AMAP_WEB_KEY 注入，绝不写进代码仓库。
    web-key: ${PADGUARD_AMAP_WEB_KEY:}
  mail:
    # 总开关：SMTP 主机已配置且本项为 true 时才真正发信；否则仅记日志 + 后台弹窗显示明文口令
    enabled: ${PADGUARD_MAIL_ENABLED:false}
    from: ${PADGUARD_MAIL_FROM:no-reply@padguard.com}
  stream:
    # 实时看屏并发准入上限：同时推流的设备数达到此值后，新的开流请求被拒绝（已开的不受影响）。
    # 服务端中转架构下每路都是"上行+下行"带宽，不限制时出口带宽会随并发线性打满。
    # 按服务器出口带宽估算：单路高清约 1.5MB/s（上+下），1000 路约 1.5GB/s 出口，
    # 请结合实际带宽与机器规格调整；家庭/小批量部署保持默认即可。
    max-live-devices: 1000
  jwt:
    # 留空 = 首次启动自动生成随机密钥并写入 config/jwt-secret.txt（不进安装包，每次部署不同）。
    # 多实例部署时必须显式指定（建议用环境变量 PADGUARD_JWT_SECRET 注入），
    # 否则每个实例各自生成，token 无法跨实例校验。
    secret: ""
    access-ttl-minutes: 120
    refresh-ttl-days: 30
  auth:
    # 短信登录未接入短信服务商（发码是假的、验证码也不校验），开启等于留一条免密入口。
    # 真正接入服务商后才可置为 true。
    sms-login-enabled: false
  device:
    token-ttl-days: 30
  billing:
    # ---- 免费试用 ----
    # 新用户（及升级前已存在的存量账号）自动获得试用，避免一升级就被锁死。
    # 免费内测阶段试用期延长到 30 天（暂不接真实支付）。
    trial-days: 30
    trial-devices: 3
    # ---- 价格（单位：分；运营调价改这里即可，不需要改代码发版）----
    # 定价参考国内同类 C 端家长管控（年卡 198~368 元）；
    # 年卡折合 ¥24.8/月，约为月卡 65%，与主流年付折扣区间一致。
    price:
      monthly: 3800      # ¥38
      quarterly: 9800    # ¥98（折合 ¥32.7/月）
      yearly: 29800      # ¥298（折合 ¥24.8/月）
    # ---- 各套餐可绑定设备数 ----
    devices:
      monthly: 3
      quarterly: 3
      yearly: 5
    # ---- 下单后支付超时（分钟），超时订单自动关闭 ----
    pay-timeout-minutes: 30
    # ---- 模拟支付：仅开发/联调用，生产必须 false，否则任何人可免费续费 ----
    mock-pay-enabled: false
  mqtt:
    # 本地免 Docker 运行时设为 false（见 local profile），避免强连 EMQX 导致启动失败
    enabled: true
    broker-url: "tcp://emqx:1883"
    username: ""
    password: ""
    tenant: "default"
    keep-alive-seconds: 90
  storage:
    # 本地文件存储目录（生产可换 MinIO/OSS，仅改 FileStorageService）
    dir: "./uploads"
  # 管理员初始/重置口令文件路径。默认落在挂载卷内的 uploads/ 下
  # （docker-compose 只挂 ./uploads，早期实现写工作目录 = 容器可写层，重建即丢、
  # 口令又被重置出 admin123 → 全新部署直接锁死后台）。
  # 可用环境变量 PADGUARD_INITIAL_PASSWORD_FILE 覆盖到 secrets 卷。
  initial-password-file: "uploads/管理员初始密码-请登录后修改.txt"
  # 家长端账号的初始/重置口令文件。与上面的 initial-password-file（后台管理员口令）
  # 必须是两个键：两个账号两份明文，共用一个键会被后写的覆盖先写的。
  # 可用环境变量 PADGUARD_PARENT_INITIAL_PASSWORD_FILE 覆盖到 secrets 卷。
  parent-initial-password-file: "uploads/初始密码-请登录后修改.txt"
  # 对外 base-url，用于拼接可访问的文件/资源 URL；留空则使用相对路径 /v1/files/{id}
  # 例如： http://localhost:8080
  # 键名必须与代码 FileStorageService 读取的 ${padguard.base-url} 完全一致，
  # 原先写成 padguard.storage.base-url 永不匹配、baseUrl 恒为空、"设了没用"。
  #
  # 【默认留空 —— 三端一致的设计口径】
  # 留空时下发相对路径 /v1/files/{id}，由客户端各自用"自己连的那个服务端"拼 origin：
  #   - 孩子端 MediaUrlResolver 用 TransportSettings.baseUrl 的 origin 拼接；
  #   - 家长端 retrofit.baseUrl().resolve() 同样按自身 base 解析。
  # 这样服务端换 IP / 换部署环境都不会让历史文件地址失效。
  #
  # 反例（已修复的真实故障）：曾硬编码为 http://8.148.68.183:8090（另一台服务器），
  # 而文件实际落在当前服务端的 uploads 下 → 下发的绝对地址指向没有该文件的机器，
  # 客户端下载拿到 404，孩子端表现为「视频加载失败」。
  #
  # 确需固定对外地址时（如对象存储/CDN 域名），用环境变量注入，不要写死在仓库里：
  #   PADGUARD_BASE_URL=https://files.example.com
  base-url: ${PADGUARD_BASE_URL:}
  dev:
    # 无真实被管控端时，开启内置"孩子端模拟器"自动回执指令，便于演示主链路闭环
    child-simulator: false

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/padguard
    username: padguard
    password: padguard
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  mvc:
    async:
      # 实时看屏 /v1/stream/{deviceId}/live 是长时间挂起、持续推帧的流。
      # Spring MVC 异步请求默认 30s 超时，会在画面正常推送时把连接掐断，
      # 表现为家长端每 30 秒闪一次"连接中"、观感就是"实时屏幕总断开"。
      # 调大到 10 分钟；流本身另有"设备 30s 无帧即收流"的自保护（见 ParentStreamController
      # 的 MAX_IDLE_MS），因此不会导致连接永久悬挂。
      request-timeout: 600000

  # ---- 邮件（密码重置通知等）----
  # 默认关闭：未配置 SMTP 时，重置密码仍会生成新口令并在后台弹窗显示，由管理员安全转告。
  # 配置后可向账号邮箱自动发送新密码。生产环境请通过环境变量注入凭据，不要写死在文件中：
  #   PADGUARD_MAIL_HOST / PADGUARD_MAIL_PORT / PADGUARD_MAIL_USERNAME
  #   PADGUARD_MAIL_PASSWORD / PADGUARD_MAIL_FROM
  mail:
    host: ${PADGUARD_MAIL_HOST:}
    port: ${PADGUARD_MAIL_PORT:465}
    username: ${PADGUARD_MAIL_USERNAME:}
    password: ${PADGUARD_MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true

---
spring:
  config:
    activate:
      on-profile: docker
  padguard:
    mqtt:
      broker-url: "tcp://emqx:1883"

---
# 本地免 Docker 运行：H2 文件库 + 关闭 MQTT，仅依赖本机 JVM 即可启动联调。
# 注意：这里刻意用【文件库 + ddl-auto=update】而非内存库——绑定关系属于用户资产，
# 必须"除非家长手动解绑、或服务端显式删除，否则一直存在"（重启服务端 / 重装家长端都不应丢失）。
# 早期用 h2:mem + ddl-auto=create，每次重启都会把 device 表连同绑定关系清空，
# 导致家长端重装登录后"看不到设备"、而被管控端却仍处于锁屏状态的不一致问题。
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # 不要加 AUTO_SERVER=TRUE：发布包内置的 H2 缺少 NetworkConnectionInfo 类，
    # 启用该模式会在启动阶段直接中止（表现为服务端起不来且日志停在 H2 初始化）。
    url: "jdbc:h2:file:./data/padguard;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE"
    username: "sa"
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

padguard:
  mqtt:
    enabled: false
  dev:
    child-simulator: false

---
# 家庭/本地部署包（发布用）：H2 文件库（数据持久化，重启不丢）+ 关闭 MQTT + 固定 8090 端口
# 配合发布包内的 start.bat 使用，双击即可在家长电脑上运行服务端
server:
  port: 8090

spring:
  config:
    activate:
      on-profile: home
  datasource:
    url: "jdbc:h2:file:./data/padguard;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE"
    username: "sa"
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

padguard:
  jwt:
    # 留空 = 首次启动自动生成随机密钥并写入 config/jwt-secret.txt。
    # 绝不在这里写死：密钥随安装包分发的话，任何人都能自己签发 token 冒充家长登录。
    secret: ""
  mqtt:
    # 家庭部署包内置 Mosquitto Broker（随服务端启动脚本拉起，监听 0.0.0.0:1883）。
    # 服务端本机回环连接；孩子端平板通过局域网 IP:1883 连接。
    enabled: true
    broker-url: "tcp://127.0.0.1:1883"
    username: ""
    password: ""
    tenant: "default"
    keep-alive-seconds: 90
  storage:
    dir: "./uploads"
  dev:
    child-simulator: false
