# 生产编排（阿里云轻量，武汉）——与 test 用 docker-compose.yml 相互独立。
# 差异：postgres 无宿主端口映射（仅 compose 内网）、broker 换 Mosquitto（password_file 认证）、
#       Nginx 终止 TLS（443 对外）、uploads/admin 目录挂载持久化、密码与 JWT 走 .env。
#
# 前置（一次性）：
#   1) cp .env.prod.example .env 并填入强密码
#   2) 生成 mosquitto/passwd（mosquitto_passwd，见 docs/控制端手机适配与云服务器迁移计划.md M3）
#      —— 至少要含 pgserver（服务端容器连接用）；每设备用户由同步脚本开通，见 5)
#   3) 生成 TLS 证书：bash scripts/gen-certs.sh 你的域名（自签名仅测试/内网；生产换 Let's Encrypt/商业证书）
#
# 用法：
#   docker compose -f docker-compose.prod.yml up -d postgres mosquitto nginx
#   docker compose -f docker-compose.prod.yml up -d --build app
#
# 每设备 MQTT 凭据（绑定新设备后执行，幂等，可放 cron）：
#   ./scripts/sync-mqtt-users.sh          # devices 表 -> mosquitto/passwd + SIGHUP 热加载
#   不跑的话新设备连不上 broker，MQTT 静默退化为 HTTP 轮询。
#   broker 侧 ACL 已按 username=deviceId 收紧（见 mosquitto/aclfile），跨设备/跨租户读写被拒。
#
# 端口安全说明：
#   · 公网仅暴露 80/443（Nginx，TLS 在此终止）与 8883（MQTT over TLS）。
#   · 1883（MQTT 明文）与 8080（app）仅 compose 内网，绝不映射到宿主，避免凭据/令牌明文暴露。
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-padguard}
      # PG_USER 不设默认：app 的 ProdConfigAssertion 把 "padguard" 判为弱口令并拒绝启动，
      # 留默认值会导致只改密码、忘改用户名的部署启动即失败。强制显式设置自定义用户名。
      POSTGRES_USER: ${PG_USER:?PG_USER 必须在 .env 中设置自定义用户名（不可用默认的 padguard）}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD 必须在 .env 中设置强密码}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:?PG_USER 未设置} -d ${PG_DB:-padguard}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"   # 公网 MQTT over TLS（设备从公网连；1883 明文仅内网，不映射）
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/certs:/mosquitto/config/certs:ro
      - mosquitto-data:/mosquitto/data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        # 等 /health 真正 UP（DB 就绪）再放流量，避免发布窗口把 502 暴露给公网
        condition: service_healthy
    ports:
      - "80:80"     # HTTP 一律 301 重定向到 HTTPS
      - "443:443"   # 公网 HTTPS 入口，TLS 在此终止，反代到 app:8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
    environment:
      TZ: Asia/Shanghai

  app:
    build: .
    restart: unless-stopped
    # app 仅 compose 内网监听 8080，公网经 nginx:443 反代；此处不映射 8080 到宿主。
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PG_DB:-padguard}?reWriteBatchedInserts=true
      SPRING_DATASOURCE_USERNAME: ${PG_USER:?PG_USER 未设置（须为自定义用户名，不可用 padguard）}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD}
      PADGUARD_JWT_SECRET: ${PADGUARD_JWT_SECRET:?PADGUARD_JWT_SECRET 必须在 .env 中设置强随机值}
      # app 连 mosquitto 走内网明文 1883（compose 内网，不暴露公网），避免服务端处理 TLS 信任
      PADGUARD_MQTT_BROKER_URL: tcp://mosquitto:1883
      PADGUARD_MQTT_USERNAME: ${PADGUARD_MQTT_USERNAME:?PADGUARD_MQTT_USERNAME 必须在 .env 中设置}
      PADGUARD_MQTT_PASSWORD: ${PADGUARD_MQTT_PASSWORD:?PADGUARD_MQTT_PASSWORD 必须在 .env 中设置}
      # 设备凭据必须留空走每设备 username=deviceId + mk_<uuid>（见 .env.prod.example）。
      # 这里用 :- 允许空值；旧的 :? 强制填写会逼运维填共享 pgdevice，
      # 而生产 aclfile 无此用户 → 设备 MQTT 全部握手失败、静默退化轮询。
      PADGUARD_MQTT_DEVICE_USERNAME: ${PADGUARD_MQTT_DEVICE_USERNAME:-}
      PADGUARD_MQTT_DEVICE_PASSWORD: ${PADGUARD_MQTT_DEVICE_PASSWORD:-}
      PADGUARD_DEV_CHILDSIMULATOR: "false"
      # 限流 IP 维度必须采信代理写入的 X-Real-IP：
      # 生产流量全部经 nginx 反代，remoteAddr 恒为 nginx 容器地址 —— 不开这个开关时
      # 所有家长共用同一个 IP 桶（登录 5 次/分钟），几个人同时登录就会互相 429。
      # 代码侧只采信 X-Real-IP（nginx 用 $remote_addr 覆盖，客户端伪造无效），不采信 XFF。
      PADGUARD_RATELIMIT_TRUSTFORWARDEDFOR: "true"
      # 服务端对外地址：可选。不填时公开端点会回落到"本次请求的 Host 头"（客户端实际连到的地址），
      # 这比任何硬编码默认值都准。只有当反代改写了 Host、或客户端需要拿到与访问地址不同的公开域名时
      # 才需要显式指定（例：内网经反代访问，但对孩子端要下发公网域名）。
      # PADGUARD_PUBLIC_HOST: "guard.example.com"
      # 浏览器侧 WebSocket 来源白名单：默认空 = 只放行不带 Origin 的原生客户端（家长端 APK 即此类），
      # 任何网页发起的握手一律 403（CSWSH 防护）。将来做 Web 家长端时把域名填进来。
      # PADGUARD_WS_ALLOWED_ORIGINS: "https://guard.example.com"
      # 初始/重置口令文件移出 uploads（第八轮评估第三批+纵深防御）：
      # uploads 是"用户媒体目录"，运维一旦加 nginx alias/改挂载就会把口令明文一并暴露；
      # 独立 secrets 卷与业务文件物理隔离，且同样持久化（容器重建不丢）。
      PADGUARD_INITIAL_PASSWORD_FILE: /app/secrets/管理员初始密码-请登录后修改.txt
      PADGUARD_PARENT_INITIAL_PASSWORD_FILE: /app/secrets/初始密码-请登录后修改.txt
      # ---- 高德 Web 服务 Key（逆地理编码）与邮件透传 ----
      # application.yml 声明了这些注入点，但 compose 只透传显式声明的变量：
      # 漏配时 .env 里即使填了也进不了容器，表现为定位无地址反查/邮箱静默不发信（无任何报错）。
      PADGUARD_AMAP_WEB_KEY: ${PADGUARD_AMAP_WEB_KEY:-}
      PADGUARD_MAIL_ENABLED: ${PADGUARD_MAIL_ENABLED:-false}
      PADGUARD_MAIL_FROM: ${PADGUARD_MAIL_FROM:-no-reply@padguard.com}
      PADGUARD_MAIL_HOST: ${PADGUARD_MAIL_HOST:-}
      PADGUARD_MAIL_PORT: ${PADGUARD_MAIL_PORT:-465}
      PADGUARD_MAIL_USERNAME: ${PADGUARD_MAIL_USERNAME:-}
      PADGUARD_MAIL_PASSWORD: ${PADGUARD_MAIL_PASSWORD:-}
      # ---- 微信支付 v3（billing wechat）透传：缺省全空 = 不启用（fail-closed，收银台该渠道置灰）----
      # 注意：compose 只透传在此显式声明的变量，.env 里定义但不声明 = 不会进容器。
      # 空字符串绑定安全：WeChatPayProperties 全字段 isNullOrBlank() 判空，File("") 非目录被跳过。
      # BASE_URL / CERT_AUTO_REFRESH 有 yml 默认值，勿用空默认透传覆盖（否则 BaseURL 会被绑成空串）。
      PADGUARD_BILLING_WECHAT_ENABLED: ${PADGUARD_BILLING_WECHAT_ENABLED:-false}
      PADGUARD_BILLING_WECHAT_APP_ID: ${PADGUARD_BILLING_WECHAT_APP_ID:-}
      PADGUARD_BILLING_WECHAT_MCH_ID: ${PADGUARD_BILLING_WECHAT_MCH_ID:-}
      PADGUARD_BILLING_WECHAT_SERIAL_NO: ${PADGUARD_BILLING_WECHAT_SERIAL_NO:-}
      PADGUARD_BILLING_WECHAT_API_V3_KEY: ${PADGUARD_BILLING_WECHAT_API_V3_KEY:-}
      PADGUARD_BILLING_WECHAT_PRIVATE_KEY_PEM: ${PADGUARD_BILLING_WECHAT_PRIVATE_KEY_PEM:-}
      PADGUARD_BILLING_WECHAT_PRIVATE_KEY_PATH: ${PADGUARD_BILLING_WECHAT_PRIVATE_KEY_PATH:-}
      PADGUARD_BILLING_WECHAT_NOTIFY_URL: ${PADGUARD_BILLING_WECHAT_NOTIFY_URL:-}
      PADGUARD_BILLING_WECHAT_REFUND_NOTIFY_URL: ${PADGUARD_BILLING_WECHAT_REFUND_NOTIFY_URL:-}
      PADGUARD_BILLING_WECHAT_PLATFORM_CERT_DIR: ${PADGUARD_BILLING_WECHAT_PLATFORM_CERT_DIR:-}
    volumes:
      - ../padguard-admin:/app/padguard-admin:ro   # 后台 SPA 同源托管 /admin/
      - ./uploads:/app/uploads                     # 用户录屏/截图，容器重建不丢
      - ./secrets:/app/secrets                     # 管理员/家长初始口令文件（敏感，勿挂给 nginx）
    # 健康检查（第八轮评估运维批）：探 /health（含真实 DB 查询，进程活着但库不可用会 503）。
    # start_period 给足 JVM 启动 + Flyway 迁移时间；连续失败由 docker 自动重启。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  pgdata:
  mosquitto-data:
