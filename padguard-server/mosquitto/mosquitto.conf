# Mosquitto 2.x 生产配置
# ---------------------------------------------------------------------------
# 两个监听端口：
#  · 1883 明文 —— 仅 compose 内网使用（padguard-server 容器内部连接，绝不映射公网）。
#  · 8883 TLS  —— 公网/云部署入口，设备凭据与指令经 TLS 加密传输（docker-compose 映射到宿主）。
# 切勿把 1883 映射到公网：那样设备凭据会明文暴露。
# ---------------------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/aclfile

# 内网明文（仅 compose 内网，padguard-server 容器连它；云部署不要映射此端口到宿主）
listener 1883 0.0.0.0

# 公网 TLS 入口（孩子端设备从公网连这个端口）
listener 8883 0.0.0.0
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/

log_dest stdout
